<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOT - 팔레트 - RFID 통합 관리</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 25px 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .tab {
            flex: 1;
            padding: 15px 20px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab:hover {
            background: #e9ecef;
        }

        .tab.active {
            color: #667eea;
            background: white;
            border-bottom-color: #667eea;
        }

        .form-section {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .form-field label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
            font-size: 14px;
        }

        .form-field input, .form-field select, .form-field textarea {
            padding: 10px 12px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-field input[readonly] {
            background: #e9ecef;
            cursor: not-allowed;
        }

        .auto-generated {
            background: #d4edda !important;
            color: #155724;
            font-weight: 600;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .info-box strong {
            color: #667eea;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        .btn-warning:hover {
            background: #e0a800;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        .btn-warning:hover {
            background: #e0a800;
        }

        .btn-small {
            padding: 5px 12px;
            font-size: 12px;
        }

        .content-section {
            padding: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: white;
            margin-bottom: 20px;
        }

        thead {
            background: #f8f9fa;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
            color: #495057;
            border-bottom: 2px solid #dee2e6;
        }

        tbody tr {
            border-bottom: 1px solid #e9ecef;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody tr.expandable {
            cursor: pointer;
        }

        tbody tr.expanded {
            background: #e7f3ff;
        }

        tbody tr.palette-row {
            background: #f8f9fa;
        }

        tbody tr.palette-row:hover {
            background: #e9ecef;
        }

        td {
            padding: 12px 10px;
            vertical-align: middle;
        }

        .expand-icon {
            cursor: pointer;
            color: #667eea;
            font-size: 16px;
            user-select: none;
            transition: transform 0.3s;
            display: inline-block;
            width: 20px;
        }

        .expand-icon.expanded {
            transform: rotate(90deg);
        }

        .indent {
            padding-left: 40px;
        }

        .item-type-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .type-raw {
            background: #d1ecf1;
            color: #0c5460;
        }

        .type-wip {
            background: #fff3cd;
            color: #856404;
        }

        .type-product {
            background: #d4edda;
            color: #155724;
        }

        .pallet-status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-generated {
            background: #e2e3e5;
            color: #383d41;
        }

        .status-empty {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-stock {
            background: #d4edda;
            color: #155724;
        }

        .status-finished {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-unregistered {
            background: #f8d7da;
            color: #721c24;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            padding: 20px 25px;
            background: #667eea;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 12px 12px 0 0;
        }

        .modal-header h2 {
            font-size: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            line-height: 1;
        }

        .modal-body {
            padding: 25px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #495057;
            padding-bottom: 8px;
            border-bottom: 2px solid #e9ecef;
        }

        .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #f8f9fa;
        }

        .detail-label {
            font-weight: 600;
            color: #6c757d;
            min-width: 120px;
        }

        .detail-value {
            color: #212529;
        }

        .rfid-status {
            text-align: center;
            padding: 30px;
        }

        .rfid-status.unregistered {
            background: #fff3cd;
            border-radius: 8px;
            border: 2px solid #ffc107;
        }

        .rfid-status.registered {
            background: #d4edda;
            border-radius: 8px;
            border: 2px solid #28a745;
        }

        .rfid-input-section {
            margin-top: 20px;
        }

        .rfid-input-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .rfid-scanning {
            display: none;
            text-align: center;
            padding: 20px;
            background: #e7f3ff;
            border-radius: 8px;
            margin-top: 15px;
        }

        .rfid-scanning.active {
            display: block;
        }

        .scanning-animation {
            font-size: 48px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        thead input, thead select {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        thead input::placeholder {
            color: #adb5bd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>LOT - 팔레트 - RFID 통합 관리</h1>
            <p>LOT 생성, 팔레트 매핑, RFID 등록 페이지</p>
        </div>

        <!-- 통합 LOT 생성 폼 -->
        <div class="form-section active" id="unifiedForm">
            <h2 style="margin-bottom: 20px; color: #495057;">LOT 생성 / 팔레트 - RFID 등록</h2>
            <div class="info-box" id="infoBox">
                <strong>ℹ️ 안내:</strong> 원자재는 팔레트/RFID 추적이 필요 없습니다. 생산 LOT은 팔레트가 자동으로 분할되고, RFID 태그를 등록할 수 있습니다.
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label>공정 *</label>
                    <select id="processType" onchange="onProcessChange()">
                        <option value="RAW">원자재</option>
                        <option value="2">샤링 (SH)</option>
                        <option value="3">프레스 (PR)</option>
                        <option value="4">조립 (AS)</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>LOT 번호 (자동 생성)</label>
                    <input type="text" id="lotNumber" readonly class="auto-generated" value="IN-241217-001">
                </div>
                <div class="form-field">
                    <label>바코드 (자동 생성)</label>
                    <input type="text" id="barcode" readonly class="auto-generated" value="">
                </div>
            </div>
            <div class="form-row">
                <div class="form-field" id="rawItemField">
                    <label>품목 (원자재) *</label>
                    <select id="rawItemId">
                        <option value="">선택하세요</option>
                        <option value="1">STEEL-SPCC - SPCC 냉연강판</option>
                        <option value="2">STEEL-SPHC - SPHC 열연강판</option>
                        <option value="3">AL-5052 - 알루미늄 5052</option>
                    </select>
                </div>
                <div class="form-field" id="prodItemField" style="display: none;">
                    <label>품목 (생산품) *</label>
                    <select id="prodItemId">
                        <option value="">선택하세요</option>
                        <option value="4">71412-T6000S - PNL-FR DR INR LH</option>
                        <option value="5">71412-T6000S-PR - PNL-FR DR INR (프레스)</option>
                        <option value="6">76211-GI000 - ASSY-FR DR MODULE</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>수량 *</label>
                    <input type="number" id="quantity" placeholder="예: 500" min="1" value="500" oninput="calculatePalettes()">
                </div>
                <div class="form-field" id="paletteCapacityField" style="display: none;">
                    <label>팔레트당 적재량 *</label>
                    <input type="number" id="paletteCapacity" placeholder="예: 50" min="1" value="50" oninput="calculatePalettes()">
                </div>
            </div>
            <div class="form-row">
                <div class="form-field" id="paletteCountField" style="display: none;">
                    <label>필요 팔레트 수 (자동 계산)</label>
                    <input type="text" id="paletteCount" readonly class="auto-generated" value="0">
                </div>
                <div class="form-field">
                    <label id="dateLabel">입고일 *</label>
                    <input type="date" id="productionDate" value="2024-12-17">
                </div>
                <div class="form-field" id="supplierField">
                    <label>공급사 *</label>
                    <input type="text" id="supplier" placeholder="예: 포스코" value="포스코">
                </div>
                <div class="form-field" id="workerField" style="display: none;">
                    <label>작업자 *</label>
                    <input type="text" id="worker" placeholder="예: 김철수" value="김철수">
                </div>
            </div>
            <div class="form-row" id="inputLotRow" style="display: none;">
                <div class="form-field">
                    <label>투입 원자재/중간품 LOT *</label>
                    <select id="inputLot">
                        <option value="">선택하세요</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>투입 수량 *</label>
                    <input type="number" id="inputQuantity" placeholder="투입할 수량" min="1" value="400">
                </div>
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label>비고 (선택)</label>
                    <textarea id="notes" rows="2" placeholder="추가 정보 입력"></textarea>
                </div>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="resetForm()">취소</button>
                <button class="btn btn-primary" id="submitBtn" onclick="createLot()">📥 LOT 등록</button>
            </div>
        </div>

        <div class="content-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0; color: #495057;">LOT 목록</h2>
                <button class="btn btn-primary" onclick="openBulkRfidRegistration()" id="bulkRfidBtn" style="display: none;">
                    🏷️ RFID 대량등록
                </button>
            </div>

            <!-- 검색 필터 섹션 -->
            <div id="searchFilterSection" style="display: none; background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                <div class="form-row">
                    <div class="form-field">
                        <label>🔍 LOT 번호</label>
                        <input type="text" id="filterLotNumber" placeholder="LOT 번호 검색..." oninput="filterTable()">
                    </div>
                    <div class="form-field">
                        <label>📦 품목 유형</label>
                        <select id="filterItemType" onchange="filterTable()">
                            <option value="">전체</option>
                            <option value="RAW">원자재</option>
                            <option value="WIP">재공품</option>
                            <option value="PRODUCT">완제품</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label>🏷️ 품목코드</label>
                        <input type="text" id="filterItemCode" placeholder="품목코드 검색..." oninput="filterTable()">
                    </div>
                    <div class="form-field">
                        <label>📅 생산/입고일</label>
                        <input type="date" id="filterDate" onchange="filterTable()">
                    </div>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
                    <button class="btn btn-secondary btn-small" onclick="clearAllFilters()">필터 초기화</button>
                </div>
            </div>

            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">📦</div>
                <h3>생성된 LOT이 없습니다</h3>
                <p>상단 양식을 작성하여 새 LOT을 생성하세요</p>
            </div>
            <div id="tableContainer" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px;"></th>
                            <th style="width: 150px;">LOT 번호</th>
                            <th style="width: 100px;">품목 유형</th>
                            <th style="width: 180px;">품목코드</th>
                            <th style="width: 100px;">수량</th>
                            <th style="width: 100px;">팔레트 수</th>
                            <th style="width: 120px;">생산/입고일</th>
                            <th style="width: 120px;">상태</th>
                        </tr>
                    </thead>
                    <tbody id="lotTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 팔레트 상세 모달 -->
    <div class="modal" id="paletteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📋 팔레트 상세 정보</h2>
                <button class="modal-close" onclick="closeModal('paletteModal')">&times;</button>
            </div>
            <div class="modal-body" id="paletteModalBody">
            </div>
        </div>
    </div>

    <!-- RFID 등록 모달 -->
    <div class="modal" id="rfidModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🏷️ RFID 등록</h2>
                <button class="modal-close" onclick="closeModal('rfidModal')">&times;</button>
            </div>
            <div class="modal-body" id="rfidModalBody">
            </div>
        </div>
    </div>

    <!-- RFID 대량등록 모달 -->
    <div class="modal" id="bulkRfidModal">
        <div class="modal-content" style="max-width: 1000px;">
            <div class="modal-header">
                <h2>🏷️ RFID 대량등록</h2>
                <button class="modal-close" onclick="closeModal('bulkRfidModal')">&times;</button>
            </div>
            <div class="modal-body" id="bulkRfidModalBody">
            </div>
        </div>
    </div>

    <script>
        let lotData = [];
        let expandedLots = new Set();
        let lotCounters = {
            'IN': 1,
            'SH': 1,
            'PR': 1,
            'AS': 1
        };
        let barcodeCounter = 1;

        // 공정 변경 시 필드 표시/숨김 처리
        function onProcessChange() {
            const processType = document.getElementById('processType').value;
            const isRaw = processType === 'RAW';

            // 필드 표시/숨김
            document.getElementById('rawItemField').style.display = isRaw ? 'block' : 'none';
            document.getElementById('prodItemField').style.display = isRaw ? 'none' : 'block';
            document.getElementById('paletteCapacityField').style.display = isRaw ? 'none' : 'block';
            document.getElementById('paletteCountField').style.display = isRaw ? 'none' : 'block';
            document.getElementById('supplierField').style.display = isRaw ? 'block' : 'none';
            document.getElementById('workerField').style.display = isRaw ? 'none' : 'block';
            document.getElementById('inputLotRow').style.display = isRaw ? 'none' : 'flex';

            // 날짜 레이블 변경
            document.getElementById('dateLabel').textContent = isRaw ? '입고일 *' : '생산일 *';

            // 버튼 텍스트 변경
            document.getElementById('submitBtn').innerHTML = isRaw ? '📥 원자재 입고 등록' : '🏭 생산 LOT 생성';

            // 안내 메시지 변경
            const infoBox = document.getElementById('infoBox');
            if (isRaw) {
                infoBox.innerHTML = '<strong>ℹ️ 안내:</strong> 원자재는 팔레트/RFID 추적이 필요 없습니다. LOT만 생성하여 추적성을 시작합니다.';
            } else {
                infoBox.innerHTML = '<strong>ℹ️ 안내:</strong> 생산 LOT 생성 시 팔레트가 자동으로 분할되고, RFID 태그를 등록할 수 있습니다.';
            }

            // LOT 번호 및 바코드 업데이트
            updateLotNumber();
            updateInputLotOptions();
            calculatePalettes();
        }

        // 팔레트 수 자동 계산
        function calculatePalettes() {
            const processType = document.getElementById('processType').value;
            if (processType === 'RAW') {
                document.getElementById('paletteCount').value = '0';
                return;
            }

            const quantity = parseInt(document.getElementById('quantity').value) || 0;
            const capacity = parseInt(document.getElementById('paletteCapacity').value) || 1;
            const paletteCount = Math.ceil(quantity / capacity);
            document.getElementById('paletteCount').value = paletteCount || 0;
        }

        // LOT 번호 업데이트
        function updateLotNumber() {
            const processType = document.getElementById('processType').value;
            const prefixMap = {
                'RAW': 'IN',
                '2': 'SH',
                '3': 'PR',
                '4': 'AS'
            };
            const prefix = prefixMap[processType] || 'XX';
            const today = new Date().toISOString().slice(2, 10).replace(/-/g, '').slice(0, 6);
            const seq = String(lotCounters[prefix] || 1).padStart(3, '0');
            document.getElementById('lotNumber').value = `${prefix}-${today}-${seq}`;

            // 바코드 자동 생성
            generateBarcode();
        }

        // 바코드 자동 생성
        function generateBarcode() {
            const today = new Date().toISOString().slice(2, 10).replace(/-/g, '');
            const seq = String(barcodeCounter).padStart(6, '0');
            document.getElementById('barcode').value = `BC${today}${seq}`;
        }

        // 투입 LOT 옵션 업데이트
        function updateInputLotOptions() {
            const inputLotSelect = document.getElementById('inputLot');
            inputLotSelect.innerHTML = '<option value="">선택하세요</option>';

            // 재고가 있는 LOT만 표시
            lotData.filter(lot => lot.quantity > 0).forEach(lot => {
                const option = document.createElement('option');
                option.value = lot.lotNumber;
                option.textContent = `${lot.lotNumber} - ${lot.itemCode} (${lot.quantity}개 재고)`;
                inputLotSelect.appendChild(option);
            });
        }

        // 통합 LOT 생성 함수
        function createLot() {
            const processType = document.getElementById('processType').value;

            if (processType === 'RAW') {
                createRawLot();
            } else {
                createProductionLot();
            }
        }

        // 원자재 LOT 생성
        function createRawLot() {
            const itemId = document.getElementById('rawItemId').value;
            const quantity = parseInt(document.getElementById('quantity').value);
            const productionDate = document.getElementById('productionDate').value;
            const supplier = document.getElementById('supplier').value;

            if (!itemId || !quantity || !productionDate || !supplier) {
                alert('모든 필수 항목을 입력해주세요.');
                return;
            }

            const lotNumber = document.getElementById('lotNumber').value;
            const barcode = document.getElementById('barcode').value;
            const itemCode = document.querySelector(`#rawItemId option[value="${itemId}"]`).text.split(' - ')[0];
            const itemName = document.querySelector(`#rawItemId option[value="${itemId}"]`).text.split(' - ')[1];

            const lot = {
                lotNumber: lotNumber,
                itemCode: itemCode,
                itemName: itemName,
                itemType: 'RAW',
                quantity: quantity,
                initialQuantity: quantity,
                status: 'STOCK',
                productionDate: productionDate,
                supplier: supplier,
                barcode: barcode,
                notes: document.getElementById('notes').value || null,
                palettes: [],
                rfidRegistered: 0
            };

            lotData.push(lot);
            lotCounters['IN']++;
            barcodeCounter++;
            updateLotNumber();
            renderLotTable();
            resetForm();

            alert(`원자재 LOT ${lotNumber} 등록 완료!\n바코드: ${barcode}`);
        }

        // 생산 LOT 생성
        function createProductionLot() {
            const processId = document.getElementById('processType').value;
            const itemId = document.getElementById('prodItemId').value;
            const quantity = parseInt(document.getElementById('quantity').value);
            const paletteCapacity = parseInt(document.getElementById('paletteCapacity').value);
            const worker = document.getElementById('worker').value;
            const inputLot = document.getElementById('inputLot').value;
            const inputQuantity = parseInt(document.getElementById('inputQuantity').value);

            if (!processId || !itemId || !quantity || !paletteCapacity || !worker || !inputLot || !inputQuantity) {
                alert('모든 필수 항목을 입력해주세요.');
                return;
            }

            const paletteCount = Math.ceil(quantity / paletteCapacity);
            const lotNumber = document.getElementById('lotNumber').value;
            const barcode = document.getElementById('barcode').value;
            const itemCode = document.querySelector(`#prodItemId option[value="${itemId}"]`).text.split(' - ')[0];
            const itemName = document.querySelector(`#prodItemId option[value="${itemId}"]`).text.split(' - ')[1];
            const processName = document.querySelector(`#processType option[value="${processId}"]`).text.split(' ')[0];

            // 품목 유형 결정
            let itemType = 'WIP';
            if (processName === '조립') {
                itemType = 'PRODUCT';
            }

            // 팔레트 자동 생성
            const palettes = [];
            for (let i = 1; i <= paletteCount; i++) {
                const paletteQuantity = i === paletteCount
                    ? quantity - (paletteCapacity * (paletteCount - 1))
                    : paletteCapacity;

                palettes.push({
                    id: `${lotNumber}-PLT-${String(i).padStart(3, '0')}`,
                    paletteNumber: i,
                    quantity: paletteQuantity,
                    rfidEpc: null,
                    status: 'Generated'
                });
            }

            const lot = {
                lotNumber: lotNumber,
                itemCode: itemCode,
                itemName: itemName,
                itemType: itemType,
                quantity: quantity,
                initialQuantity: quantity,
                status: 'STOCK',
                productionDate: document.getElementById('productionDate').value,
                processName: processName,
                workerName: worker,
                barcode: barcode,
                palettes: palettes,
                paletteCapacity: paletteCapacity,
                paletteCount: paletteCount,
                rfidRegistered: 0,
                inputLot: inputLot,
                inputQuantity: inputQuantity
            };

            lotData.push(lot);

            // LOT 카운터 업데이트
            const prefix = lotNumber.split('-')[0];
            lotCounters[prefix]++;
            barcodeCounter++;
            updateLotNumber();

            renderLotTable();
            resetForm();

            alert(`생산 LOT ${lotNumber} 생성 완료!\n바코드: ${barcode}\n팔레트 ${paletteCount}개가 자동 생성되었습니다.\n\n투입 LOT: ${inputLot} (${inputQuantity}개)`);
        }

        function renderLotTable(filterLotNumber = '', filterItemType = '', filterItemCode = '', filterDate = '') {
            if (lotData.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('tableContainer').style.display = 'none';
                document.getElementById('searchFilterSection').style.display = 'none';
                document.getElementById('bulkRfidBtn').style.display = 'none';
                return;
            }

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('tableContainer').style.display = 'block';
            document.getElementById('searchFilterSection').style.display = 'block';

            // Check if there are any lots with unregistered RFIDs
            const hasUnregisteredRfid = lotData.some(lot =>
                lot.palettes && lot.palettes.length > 0 && lot.rfidRegistered < lot.paletteCount
            );
            document.getElementById('bulkRfidBtn').style.display = hasUnregisteredRfid ? 'block' : 'none';

            const tbody = document.getElementById('lotTableBody');
            tbody.innerHTML = '';

            // 필터링된 데이터
            const filteredData = lotData.filter(lot => {
                const matchLotNumber = !filterLotNumber || lot.lotNumber.toLowerCase().includes(filterLotNumber);
                const matchItemType = !filterItemType || lot.itemType === filterItemType;
                const matchItemCode = !filterItemCode || lot.itemCode.toLowerCase().includes(filterItemCode);
                const matchDate = !filterDate || lot.productionDate === filterDate;
                return matchLotNumber && matchItemType && matchItemCode && matchDate;
            });

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #6c757d;">필터 조건에 맞는 LOT이 없습니다.</td></tr>';
                return;
            }

            filteredData.forEach(lot => {
                const isExpanded = expandedLots.has(lot.lotNumber);

                // LOT 행
                const tr = document.createElement('tr');
                tr.className = lot.palettes.length > 0 ? 'expandable' : '';
                if (isExpanded) tr.classList.add('expanded');
                
                const paletteDisplay = lot.itemType === 'RAW' ? '-' : `${lot.paletteCount}개`;
                const rfidStatus = lot.itemType === 'RAW' ? '-' : 
                    lot.rfidRegistered === lot.paletteCount ? '✅ 완료' : 
                    lot.rfidRegistered > 0 ? `⚠️ ${lot.rfidRegistered}/${lot.paletteCount}` : '❌ 미등록';

                tr.innerHTML = `
                    <td>
                        ${lot.palettes.length > 0 ? `<span class="expand-icon ${isExpanded ? 'expanded' : ''}" onclick="toggleLot('${lot.lotNumber}')">▶</span>` : ''}
                    </td>
                    <td><strong>${lot.lotNumber}</strong></td>
                    <td><span class="item-type-badge type-${lot.itemType.toLowerCase()}">${getItemTypeLabel(lot.itemType)}</span></td>
                    <td>${lot.itemCode}</td>
                    <td>${lot.quantity}개</td>
                    <td>${paletteDisplay}</td>
                    <td>${lot.productionDate}</td>
                    <td>${rfidStatus}</td>
                `;
                tbody.appendChild(tr);

                // 팔레트 행들 (확장된 경우)
                if (isExpanded && lot.palettes.length > 0) {
                    lot.palettes.forEach(palette => {
                        const paletteTr = document.createElement('tr');
                        paletteTr.className = 'palette-row';
                        const paletteStatus = palette.status || 'Generated';
                        paletteTr.innerHTML = `
                            <td></td>
                            <td class="indent">
                                <a href="#" onclick="showPaletteDetail('${lot.lotNumber}', '${palette.id}'); return false;" 
                                   style="color: #667eea; text-decoration: none; font-weight: 600;">
                                    ${palette.id}
                                </a>
                            </td>
                            <td>팔레트 #${palette.paletteNumber}</td>
                            <td>-</td>
                            <td>${palette.quantity}개</td>
                            <td>-</td>
                            <td>-</td>
                            <td>
                                <span class="pallet-status-badge status-${paletteStatus.toLowerCase()}">
                                    ${palette.rfidEpc ? '등록완료' : '미등록'}
                                </span>
                            </td>
                        `;
                        tbody.appendChild(paletteTr);
                    });
                }
            });
        }

        function toggleLot(lotNumber) {
            if (expandedLots.has(lotNumber)) {
                expandedLots.delete(lotNumber);
            } else {
                expandedLots.add(lotNumber);
            }
            renderLotTable();
        }

        function openRfidRegistration(lotNumber, paletteId) {
            closeModal('paletteModal');
            
            const lot = lotData.find(l => l.lotNumber === lotNumber);
            if (!lot) return;

        function startRfidScanning(lotNumber, paletteId) {
            document.getElementById('rfidScanning').classList.add('active');
            
            setTimeout(() => {
                const simulatedRfid = 'E280' + Math.random().toString(36).substr(2, 20).toUpperCase();
                document.getElementById('rfidInput').value = simulatedRfid;
                stopRfidScanning();
                alert('RFID 스캔 완료!\n감지된 EPC: ' + simulatedRfid);
            }, 3000);

            document.getElementById('rfidScanning').classList.remove('active');

        function registerRfid(lotNumber, paletteId) {
            const rfidValue = document.getElementById('rfidInput').value.trim();
            
            if (!rfidValue) {
                alert('RFID EPC 코드를 입력해주세요.');
                return;
            }

            const lot = lotData.find(l => l.lotNumber === lotNumber);
            if (!lot) return;

            const palette = lot.palettes.find(p => p.id === paletteId);
            if (!palette) return;

            palette.rfidEpc = rfidValue;
            palette.status = 'Empty';
            palette.rfidRegisteredAt = new Date().toLocaleString('ko-KR');
            
            lot.rfidRegistered = lot.palettes.filter(p => p.rfidEpc).length;

            renderLotTable();
            closeModal('rfidModal');
            
            alert(`RFID 등록 완료!\n팔레트: ${paletteId}\nRFID EPC: ${rfidValue}\n\n상태: Generated → Empty`);
        }

        // RFID 대량등록 관련 함수
        let bulkRfidData = [];
        let currentBulkIndex = 0;

        function openBulkRfidRegistration() {
            // 미등록 팔레트 수집
            bulkRfidData = [];
            lotData.forEach(lot => {
                if (lot.palettes && lot.palettes.length > 0) {
                    lot.palettes.forEach(palette => {
                        if (!palette.rfidEpc) {
                            bulkRfidData.push({
                                lotNumber: lot.lotNumber,
                                itemCode: lot.itemCode,
                                itemName: lot.itemName,
                                paletteId: palette.id,
                                paletteNumber: palette.paletteNumber,
                                quantity: palette.quantity
                            });
                        }
                    });
                }
            });

            if (bulkRfidData.length === 0) {
                alert('등록할 팔레트가 없습니다.');
                return;
            }

            currentBulkIndex = 0;
            renderBulkRfidModal();
            document.getElementById('bulkRfidModal').classList.add('active');
        }

            const completedCount = currentBulkIndex;

                            <div style="background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); height: 100%; width: ${progressPercent}%; transition: width 0.3s;"></div>

                    <tr style="border-bottom: 1px solid #e9ecef; ${rowStyle}">

            html += `

                    </table>

            if (currentBulkIndex < totalCount) {
                const currentItem = bulkRfidData[currentBulkIndex];
                html += `

                        <h3 style="margin-bottom: 15px;">현재 등록 대상</h3>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                            <div><strong>LOT:</strong> ${currentItem.lotNumber}</div>
                            <div><strong>품목:</strong> ${currentItem.itemName}</div>
                            <div><strong>팔레트:</strong> ${currentItem.paletteId}</div>

                            RFID EPC 코드 입력
                        </label>
                        <input type="text" id="bulkRfidInput" placeholder="RFID EPC 번호를 입력하거나 스캔하세요" style="width: 100%; padding: 12px; border: 2px solid #dee2e6; border-radius: 6px; font-size: 14px; margin-bottom: 10px;">
                        <div style="display: flex; gap: 10px;">
                            <button class="btn btn-success" onclick="registerBulkRfidNext()" style="flex: 1;">
                                ✅ 등록 후 다음

                            닫기
                        </button>
                    </div>
                `;
            }

            modalBody.innerHTML = html;
        }

        function registerBulkRfidNext() {
            const rfidValue = document.getElementById('bulkRfidInput').value.trim();

            if (!rfidValue) {
                alert('RFID EPC 코드를 입력해주세요.');
                return;
            }

            const currentItem = bulkRfidData[currentBulkIndex];
            currentItem.rfidEpc = rfidValue;

            // 실제 LOT 데이터 업데이트
            const lot = lotData.find(l => l.lotNumber === currentItem.lotNumber);
            if (lot) {
                const palette = lot.palettes.find(p => p.id === currentItem.paletteId);
                if (palette) {
                    palette.rfidEpc = rfidValue;
                    palette.status = 'Empty';
                    palette.rfidRegisteredAt = new Date().toLocaleString('ko-KR');
                    lot.rfidRegistered = lot.palettes.filter(p => p.rfidEpc).length;
                }
            }

            currentBulkIndex++;
            renderBulkRfidModal();

            // 포커스를 다음 입력 필드로 이동
            setTimeout(() => {
                const input = document.getElementById('bulkRfidInput');
                if (input) input.focus();
            }, 100);
        }

        function skipBulkRfid() {
            if (confirm('이 팔레트를 건너뛰시겠습니까?')) {
                currentBulkIndex++;
                renderBulkRfidModal();
            }
        }

        function startBulkScanning() {
            // 시뮬레이션: 2초 후 자동으로 RFID 스캔
            const input = document.getElementById('bulkRfidInput');
            input.value = '스캔 중...';
            input.disabled = true;

            setTimeout(() => {
                const simulatedRfid = 'E280' + Math.random().toString(36).substr(2, 20).toUpperCase();
                input.value = simulatedRfid;
                input.disabled = false;
                input.focus();
                // 자동으로 등록
                registerBulkRfidNext();
            }, 2000);
        }

        function getItemTypeLabel(type) {
            const labels = {
                'RAW': '원자재',
                'WIP': '재공품',
                'PRODUCT': '완제품'
            };
            return labels[type] || type;
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            // 대량 등록 완료 후 테이블 새로고침
            if (modalId === 'bulkRfidModal' && currentBulkIndex > 0) {
                renderLotTable();
            }
        }

        // 테이블 필터링 함수
        function filterTable() {
            const filterLotNumber = document.getElementById('filterLotNumber').value.toLowerCase();
            const filterItemType = document.getElementById('filterItemType').value;
            const filterItemCode = document.getElementById('filterItemCode').value.toLowerCase();
            const filterDate = document.getElementById('filterDate').value;

            renderLotTable(filterLotNumber, filterItemType, filterItemCode, filterDate);
        }

        // 필터 초기화 함수
        function clearAllFilters() {
            document.getElementById('filterLotNumber').value = '';
            document.getElementById('filterItemType').value = '';
            document.getElementById('filterItemCode').value = '';
            document.getElementById('filterDate').value = '';
            renderLotTable();
        }

        // 폼 초기화 함수
        function resetForm() {
            document.getElementById('processType').value = 'RAW';
            document.getElementById('rawItemId').value = '';
            document.getElementById('prodItemId').value = '';
            document.getElementById('quantity').value = '500';
            document.getElementById('paletteCapacity').value = '50';
            document.getElementById('supplier').value = '포스코';
            document.getElementById('worker').value = '김철수';
            document.getElementById('inputLot').value = '';
            document.getElementById('inputQuantity').value = '400';
            document.getElementById('notes').value = '';
            onProcessChange();
            calculatePalettes();
        }

        // 모달 외부 클릭 시 닫기
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal(this.id);
                }
            });
        });

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal('paletteModal');
                closeModal('rfidModal');
                closeModal('bulkRfidModal');
            }
        });

        // 초기 설정
        onProcessChange();
        updateLotNumber();
        updateInputLotOptions();
    </script>
</body>
</html>
